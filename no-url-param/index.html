<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Missing redirect URL</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="stylesheet" href="/assets/shared.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <div class="header-title">
          <div class="brand-mark">
            <img src="/assets/icon.svg" alt="" width="48" height="48" />
          </div>
          <div class="header-copy">
            <div class="utility-brand-title">Open bookmarks in a new tab</div>
            <p>Bookmark redirect</p>
          </div>
        </div>
      </header>

      <main class="panel">
        <section class="panel-body content-stack" aria-labelledby="page-title">
          <div class="recovery-heading">
            <div class="status-icon" aria-hidden="true">!</div>
            <h1 id="page-title">Missing redirect URL</h1>
          </div>
          <p class="lead">
            This redirect link does not include the required <code>url</code> query parameter.
          </p>
          <p><a class="link" href="/">Return to the homepage</a>.</p>
        </section>
      </main>
    </div>
  </body>
</html>
